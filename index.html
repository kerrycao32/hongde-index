<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>泓德基金指数投教长图生成器</title>
<link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
:root {
  /* 参考图片红蓝配色 - 泓德基金海报风格 */
  --primary: #3b8cff;
  --primary-light: #70b0ff;
  --primary-lighter: #b0d8ff;
  --primary-dark: #1f6fe8;
  --primary-bg: rgba(59,140,255,0.06);
  --primary-bg-light: rgba(59,140,255,0.03);
  --accent-red: #f26b4f;
  --accent-red-light: #f7937a;
  --accent-red-lighter: #fccfc3;
  --accent-red-bg: rgba(242,107,79,0.05);
  --gold: #f5a623;
  --gold-light: #f7c66b;
  --gold-bg: #fff8e8;
  --success: #2ba868;
  --danger: #f26b4f;
  --warning: #f5a623;
  --bg-page: #f0f7ff;
  --bg-card: rgba(255,255,255,0.88);
  --bg-card-solid: #ffffff;
  --bg-light: rgba(59,140,255,0.04);
  --bg-red-light: rgba(242,107,79,0.04);
  --border: rgba(59,140,255,0.12);
  --border-light: rgba(59,140,255,0.06);
  --border-red: rgba(242,107,79,0.15);
  --border-gold: #f5deb3;
  --text-main: #1a2d40;
  --text-secondary: #4a6685;
  --text-muted: #8aa0b8;
  --glass-blur: blur(12px);
  --glass-saturate: saturate(1.15);
  --font-family: "Source Han Sans SC","Source Han Sans CN","Noto Sans CJK SC","思源黑体","Microsoft YaHei",-apple-system,sans-serif;
  --font-size-base: 16px;
  --line-height-base: 1.8;
}
*{box-sizing:border-box;}
body{font-family:var(--font-family);font-size:var(--font-size-base);line-height:var(--line-height-base);color:var(--text-main);background:linear-gradient(180deg,#f0f7ff 0%,#e8f2ff 50%,#f5faff 100%);min-height:100vh;-webkit-font-smoothing:antialiased;margin:0;padding-bottom:80px;position:relative;}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 0%,rgba(59,140,255,0.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(242,107,79,0.05) 0%,transparent 50%);pointer-events:none;z-index:0;}
.title-bar{background:linear-gradient(135deg,var(--accent-red) 0%,var(--primary) 100%);box-shadow:0 3px 18px rgba(59,140,255,0.2);padding:16px 0 14px;position:relative;overflow:hidden;}
.title-bar::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,var(--gold) 50%,transparent 100%);}
.title-content{text-align:center;width:100%;padding:0 16px;}
.title-main{font-size:1.25rem;font-weight:700;letter-spacing:1px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.12);display:inline;}
.title-version{display:inline-block;font-size:0.65rem;font-weight:500;padding:2px 7px;margin-left:6px;border:1px solid var(--gold-light);border-radius:4px;color:var(--gold-light);vertical-align:middle;letter-spacing:1px;background:rgba(255,255,255,0.1);}
.title-sub{font-size:0.95rem;color:var(--gold-light);letter-spacing:3px;margin-top:6px;border:1.5px solid var(--gold-light);border-radius:6px;padding:3px 14px;display:inline-block;background:rgba(255,255,255,0.12);backdrop-filter:blur(4px);}
.container{max-width:100%;margin:0 auto;padding:0 16px;position:relative;z-index:1;}
.control-panel{background:var(--bg-card);backdrop-filter:var(--glass-blur) var(--glass-saturate);-webkit-backdrop-filter:var(--glass-blur) var(--glass-saturate);border-radius:14px;padding:22px 20px;margin-top:16px;box-shadow:0 6px 24px rgba(59,140,255,0.1);position:relative;z-index:10;border:1px solid rgba(255,255,255,0.6);}
.control-panel::before{content:"";position:absolute;top:0;left:20px;right:20px;height:3px;background:linear-gradient(90deg,var(--accent-red) 0%,var(--primary) 50%,var(--gold) 100%);border-radius:0 0 4px 4px;}
.form-label{font-size:1rem;font-weight:600;color:var(--text-secondary);margin-bottom:8px;letter-spacing:0.3px;}
.form-select{font-family:var(--font-family);font-size:0.95rem;border-color:var(--border);border-radius:8px;padding:10px 12px;background:#fff;width:100%;}
.form-select:focus{border-color:var(--primary-light);background:#fff;box-shadow:0 0 0 0.2rem rgba(59,140,255,0.12);outline:none;}
.date-input-wrap{position:relative;}

.date-input-wrap .date-hint{font-size:0.75rem;color:var(--text-muted);}
#reportDate{font-family:var(--font-family);font-size:0.95rem;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#fff;width:100%;color:var(--text-main);-webkit-appearance:none;appearance:none;}
#reportDate:focus{border-color:var(--primary-light);box-shadow:0 0 0 0.2rem rgba(59,140,255,0.12);outline:none;}
#reportDate::-webkit-calendar-picker-indicator{cursor:pointer;filter:sepia(0.3) hue-rotate(190deg) saturate(2);}

.report-card .card-title{font-size:1.15rem;font-weight:700;color:var(--primary-dark);border-bottom:2px solid;border-image:linear-gradient(90deg,var(--accent-red) 0%,var(--primary) 60%,var(--gold) 100%) 1;padding-bottom:8px;margin-bottom:16px;letter-spacing:0.5px;}
.report-header-card{background:linear-gradient(135deg,var(--accent-red) 0%,var(--primary) 100%);color:#fff;border:none;text-align:center;padding:28px 16px;position:relative;overflow:hidden;border-radius:14px;}
.report-header-card::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent 0%,var(--gold) 50%,transparent 100%);}
.report-header-card .report-title{font-size:1.3rem;font-weight:700;margin-bottom:6px;letter-spacing:1px;text-shadow:0 1px 6px rgba(0,0,0,0.15);}
.report-header-card .report-subtitle{font-size:1rem;opacity:0.95;margin-bottom:4px;}
.report-header-card .report-meta{font-size:0.85rem;opacity:0.9;}
.metrics-row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px 0;}
.metric-item{flex:1;min-width:100px;background:linear-gradient(160deg,var(--primary-bg) 0%,#fff 100%);border-radius:10px;padding:14px 8px;text-align:center;border:1px solid var(--border-light);transition:all 0.25s ease;}

.chart-container{width:100%;min-height:280px;margin:10px 0;}

.report-table thead th:first-child{border-radius:6px 0 0 0;}
.report-table thead th:last-child{border-radius:0 6px 0 0;}
.report-table tbody td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--border-light);color:var(--text-main);}
.report-table tbody td:first-child{font-weight:500;}
.report-table tbody tr:nth-child(even){background-color:var(--primary-bg-light);}

.ai-text p{margin-bottom:8px;}
.ai-text p:last-child{margin-bottom:0;}
.data-source-note{margin-top:10px;padding:5px 10px;font-size:0.7rem;color:var(--text-muted);background:var(--bg-light);border-radius:6px;border-left:2px solid var(--primary-light);}
.risk-notice{margin-top:6px;padding:12px 14px;background:var(--gold-bg);border:1px solid var(--border-gold);border-radius:8px;font-size:0.78rem;color:#8a6d00;line-height:1.75;}
.risk-notice strong{color:#7a5d00;font-weight:700;}
.share-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.95);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:0 -3px 16px rgba(59,140,255,0.1);padding:8px 16px;z-index:100;display:flex;gap:10px;max-width:960px;margin:0 auto;}
#exportWordBtn{flex:1;font-family:var(--font-family);font-size:0.95rem;font-weight:600;border-radius:24px;padding:10px 0;border:none;color:#fff;cursor:pointer;transition:all 0.2s ease;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 100%);box-shadow:0 3px 10px rgba(212,168,67,0.25);}
#exportWordBtn:hover{filter:brightness(0.95);}
#exportWordBtn:disabled{opacity:0.6;}
.toast-msg{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(135deg,var(--primary) 0%,var(--accent-red) 100%);color:#fff;padding:10px 24px;border-radius:24px;font-size:0.85rem;z-index:200;transition:transform 0.3s ease;box-shadow:0 4px 16px rgba(0,0,0,0.15);border:1px solid rgba(255,255,255,0.2);}
.toast-msg.show{transform:translateX(-50%) translateY(0);}
.export-loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:6px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.module-text{font-size:0.92rem;line-height:1.85;color:var(--text-main);margin-bottom:14px;}
.constituent-table td:first-child{text-align:left;padding-left:10px;}
.constituent-table td:last-child{text-align:right;padding-right:10px;}
@media (max-width:768px){
  .title-main{font-size:1.05rem;letter-spacing:0.5px;}
  .title-sub{font-size:0.72rem;letter-spacing:2px;}
  .metric-item{min-width:90px;padding:12px 6px;}
  .metric-item .metric-value{font-size:1.2rem;}
  .report-card{padding:18px 14px;}
  .report-card .card-title{font-size:1.05rem;}
  .report-table{font-size:0.82rem;}
  .ai-text{font-size:0.85rem;}
}
@media print{
  .title-bar,.control-panel,.share-bar,.toast-msg{display:none !important;}
  body{background:white !important;padding:0;margin:0;}
  .container{max-width:100% !important;padding:0 !important;margin:0 !important;}
  #reportArea{display:block !important;margin-top:0 !important;}
  .report-card{page-break-inside:avoid;break-inside:avoid;box-shadow:none !important;border:1px solid #ddd !important;margin-bottom:10px !important;}
}
</style>

<body>

<div class="title-bar">
  <div class="title-content">
    <span class="title-main">泓德基金指数投教长图生成器</span>
    <span class="title-version">测试版</span>
    <div class="title-sub">仅供内部使用</div>
  </div>
</div>

<div class="container">
  <div class="control-panel">
    <div class="mb-3">
      <label class="form-label">选择指数</label>
      <select id="indexSelect" class="form-select">
        <option value="">请选择指数...</option>
        <option value="000300.SH">沪深300指数（000300.SH）</option>
        <option value="000905.SH">中证500指数（000905.SH）</option>
        <option value="000510.CSI">中证A500指数（000510.CSI）</option>
        <option value="000985.CSI">中证全指（000985.CSI）</option>
        <option value="000680.SH">上证科创板综合指数（000680.SH）</option>
        <option value="H30356.CSI">中证800价值指数（H30356.CSI）</option>
        <option value="000922.CSI">中证红利指数（000922.CSI）</option>
      </select>
    </div>
    <div class="mb-3 mt-3">
      <div class="date-input-wrap">
        <div class="date-label-row">
          <label class="form-label" style="margin-bottom:0;">报告日期</label>
          <span class="date-hint">选择查看哪天的报告</span>
        </div>
        <input type="date" id="reportDate" class="form-control">
        <span class="date-effective-note" id="dateEffectiveNote"></span>
      </div>
    </div>
    <button id="generateBtn">生成长图</button>
  </div>

  <div id="reportArea">
    <div id="reportContent">
      <!-- 报告内容将动态生成 -->
    </div>
    <div class="report-card">
      <div class="risk-notice"><strong>风险提示：</strong>本材料由系统自动生成，仅供内部学习交流使用，不构成投资建议。指数过往表现不代表未来收益，投资者应根据自身风险承受能力审慎决策。如需对外使用，须按照公司合规流程审批后执行。</div>
    </div>
  </div>
</div>

<div class="share-bar" id="shareBar" style="display:none;">
  <button id="exportWordBtn">导出Word文档</button>
</div>
<div class="toast-msg" id="toast"></div>

<script>
"use strict";

var INDEX_DATA = null;
var currentCode = null;
var currentReportData = null; // 当前展示的报告数据（可能按日期调整过）
var chartInstances = {};

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');}, 3000);
}

function showLoading(){
  document.getElementById('generateBtn').disabled = true;
  document.getElementById('generateBtn').textContent = '正在生成...';
}

function hideLoading(){
  document.getElementById('generateBtn').disabled = false;
  document.getElementById('generateBtn').textContent = '生成长图';
}

function loadData(){
  return Promise.all([
    fetch('app_data.json').then(function(r){if(!r.ok)throw new Error('数据加载失败');return r.json();})
  ]).then(function(results){
    INDEX_DATA = results[0];
    console.log('数据加载成功，共' + Object.keys(INDEX_DATA).length + '个指数');
  }).catch(function(e){
    console.error(e);
    showToast('数据加载失败：' + e.message);
  });
}

function formatDate(d){
  return d.replace(/-/g,'.');
}

function parseValue(v){
  if(!v || v === '--') return null;
  var n = parseFloat(v.replace('%',''));
  return isNaN(n)?null:n;
}

// ===== 报告日期选择与交易日后端逻辑 =====
// 获取今日日期字符串 YYYY-MM-DD
function getTodayStr(){
  var d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

// 根据交易规则确定实际报告日期
// 规则：若选当天且当前时间在15:00收盘前，则取前一交易日；否则取所选日期本身
function getEffectiveReportDate(selectedDate, history){
  var todayStr = getTodayStr();
  if(selectedDate === todayStr){
    var now = new Date();
    // 15:00前 → 前一交易日
    if(now.getHours() < 15){
      var prev = findPrevTradingDay(history, selectedDate);
      if(prev) return prev;
    }
  }
  // 对于非今天的日期，找历史中该日期或之前最近的交易日
  return findClosestTradingDay(history, selectedDate);
}

// 在历史数据中找到 <= targetDate 的最近一个交易日
function findClosestTradingDay(history, targetDate){
  if(!history || history.length === 0) return targetDate;
  for(var i = history.length - 1; i >= 0; i--){
    if(history[i].date <= targetDate){
      return history[i].date;
    }
  }
  return history[0].date;
}

// 找到指定日期之前的前一个交易日
function findPrevTradingDay(history, targetDate){
  if(!history || history.length === 0) return null;
  for(var i = history.length - 1; i >= 0; i--){
    if(history[i].date < targetDate){
      return history[i].date;
    }
  }
  return null;
}

// 在历史数组中找到 effectiveDate 对应的索引
function findHistoryIndex(history, effectiveDate){
  for(var i = history.length - 1; i >= 0; i--){
    if(history[i].date <= effectiveDate) return i;
  }
  return -1;
}

// 根据历史数据重算收益率
function recalcReturns(history, effectiveIdx){
  if(effectiveIdx < 0) return null;
  var latestClose = history[effectiveIdx].close;

  function ret(days){
    var si = effectiveIdx - days;
    if(si < 0) return null;
    return ((latestClose / history[si].close) - 1) * 100;
  }

  // YTD：从当年第一个交易日算起
  function ytd(){
    var year = parseInt(history[effectiveIdx].date.substring(0,4));
    for(var i = effectiveIdx; i >= 0; i--){
      var y = parseInt(history[i].date.substring(0,4));
      if(y < year){
        return ((latestClose / history[i].close) - 1) * 100;
      }
    }
    return null;
  }

  return {
    week: ret(5),
    month: ret(20),
    month3: ret(60),
    month6: ret(120),
    year1: ret(250),
    year3: ret(750),
    year5: ret(1250),
    ytd: ytd()
  };
}

// 重算年化波动率（250日对数收益标准差 × √250）
function recalcVolatility(history, effectiveIdx){
  var startIdx = Math.max(0, effectiveIdx - 250);
  if(effectiveIdx - startIdx < 2) return null;
  var logReturns = [];
  for(var i = startIdx + 1; i <= effectiveIdx; i++){
    logReturns.push(Math.log(history[i].close / history[i-1].close));
  }
  var n = logReturns.length;
  if(n < 2) return null;
  var mean = 0;
  for(var i = 0; i < n; i++) mean += logReturns[i];
  mean /= n;
  var variance = 0;
  for(var i = 0; i < n; i++) variance += (logReturns[i] - mean) * (logReturns[i] - mean);
  variance /= (n - 1);
  return Math.sqrt(variance) * Math.sqrt(250) * 100;
}

// 重算最大回撤（250日窗口，返回负值）
function recalcMaxDrawdown(history, effectiveIdx){
  var startIdx = Math.max(0, effectiveIdx - 250);
  if(effectiveIdx - startIdx < 2) return null;
  var peak = history[startIdx].close;
  var maxDD = 0;
  for(var i = startIdx; i <= effectiveIdx; i++){
    if(history[i].close > peak) peak = history[i].close;
    var dd = (history[i].close / peak - 1) * 100;
    if(dd < maxDD) maxDD = dd;
  }
  return maxDD;
}

// 格式化收益率为带符号百分比字符串
function fmtRet(v){
  if(v === null || v === undefined) return '--';
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}

// 创建按指定日期调整后的数据副本
function getReportData(code, selectedDate){
  var original = INDEX_DATA[code];
  // 深拷贝
  var modified = JSON.parse(JSON.stringify(original));
  var history = original.history; // 用原始历史做计算（不截断）

  // 确定有效交易日
  var effectiveDate = getEffectiveReportDate(selectedDate, history);
  var effIdx = findHistoryIndex(history, effectiveDate);
  if(effIdx < 0) return modified;

  // 如果有效日期与原始数据日期一致，无需重算，直接返回原始数据
  if(effectiveDate === original.data_date){
    return modified;
  }

  // 更新日期与收盘价
  var effClose = history[effIdx].close;
  modified.latest_close = effClose;
  modified.latest_date = effectiveDate;
  modified.data_date = effectiveDate;

  // 截断历史到有效日期（用于图表展示）
  modified.history = history.slice(0, effIdx + 1).map(function(h){
    return {date: h.date, close: h.close};
  });

  // 重算收益率
  var newRet = recalcReturns(history, effIdx);
  if(newRet){
    modified.returns.week = newRet.week;
    modified.returns.month = newRet.month;
    modified.returns.month3 = newRet.month3;
    modified.returns.month6 = newRet.month6;
    modified.returns.year1 = newRet.year1;
    modified.returns.year3 = newRet.year3;
    modified.returns.year5 = newRet.year5;
    modified.returns.ytd = newRet.ytd;
  }

  // 重算波动率和最大回撤
  var vol = recalcVolatility(history, effIdx);
  var mdd = recalcMaxDrawdown(history, effIdx);
  if(vol !== null) modified.risk.volatility = vol;
  if(mdd !== null) modified.risk.max_drawdown = mdd;

  // 更新概览统计卡片
  if(modified.modules[0] && modified.modules[0].stats){
    var stats = modified.modules[0].stats;
    for(var i = 0; i < stats.length; i++){
      if(stats[i].label === '最新收盘'){
        stats[i].value = effClose.toFixed(2);
      } else if(stats[i].label === '近一年收益'){
        stats[i].value = fmtRet(newRet ? newRet.year1 : null);
      } else if(stats[i].label === '今年以来'){
        stats[i].value = fmtRet(newRet ? newRet.ytd : null);
      }
    }
  }

  // 重算跨指数对比表
  if(modified.cross_index_comparison){
    for(var j = 0; j < modified.cross_index_comparison.length; j++){
      var comp = modified.cross_index_comparison[j];
      // 在 INDEX_DATA 中找到对应指数
      var compData = null;
      for(var key in INDEX_DATA){
        if(INDEX_DATA[key].code_full === comp.code){
          compData = INDEX_DATA[key];
          break;
        }
      }
      if(compData){
        var compHistory = compData.history;
        var compIdx = findHistoryIndex(compHistory, effectiveDate);
        if(compIdx >= 0){
          var compRet = recalcReturns(compHistory, compIdx);
          if(compRet){
            comp.week = compRet.week;
            comp.month = compRet.month;
            comp.year1 = compRet.year1;
            comp.ytd = compRet.ytd;
          }
        }
      }
    }
  }

  // 如果有效日期与原始数据日期不同，在 history_text 中追加日期说明
  if(effectiveDate !== original.data_date){
    var dateNote = '\n\n（注：以下数据已按所选报告日期 ' + effectiveDate + ' 重新计算收益率、波动率及最大回撤。估值、行业分布、权重股等快照数据仍基于原始数据日期 ' + original.data_date + '。）';
    if(modified.history_text){
      modified.history_text = modified.history_text + dateNote;
    } else {
      modified.history_text = dateNote.trim();
    }
  }

  return modified;
}

function loadDocxLibrary(){
  return new Promise(function(resolve,reject){
    if(window.docx){resolve();return;}
    var script=document.createElement('script');
    script.src='https://unpkg.com/docx@8.5.0/build/index.umd.js';
    script.onload=function(){resolve();};
    script.onerror=function(){
      var s2=document.createElement('script');
      s2.src='https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js';
      s2.onload=function(){resolve();};
      s2.onerror=function(){reject(new Error('docx库加载失败'));};;
      document.head.appendChild(s2);
    };
    document.head.appendChild(script);
  });
}

function dataURItoArrayBuffer(dataURI){
  var base64=dataURI.split(',')[1];
  var binary=atob(base64);
  var len=binary.length;
  var bytes=new Uint8Array(len);
  for(var i=0;i<len;i++){bytes[i]=binary.charCodeAt(i);}
  return bytes.buffer;
}

function htmlTableToDocx(D, htmlTable){
  var rows=htmlTable.querySelectorAll('tr');
  if(rows.length===0) return null;
  var docxRows=[];
  for(var r=0;r<rows.length;r++){
    var cells=rows[r].querySelectorAll('th,td');
    var docxCells=[];
    for(var c=0;c<cells.length;c++){
      var isHeader=cells[c].tagName==='TH';
      docxCells.push(new D.TableCell({
        children:[new D.Paragraph({children:[new D.TextRun({text:cells[c].textContent.trim(),bold:isHeader,size:20,color:isHeader?"FFFFFF":"1A2E42"})],alignment:D.AlignmentType.CENTER})],
        shading:isHeader?{fill:"3B8CFF"}:(r%2===1?{fill:"F2F8FF"}:undefined),
        margins:{top:60,bottom:60,left:80,right:80},
      }));
    }
    docxRows.push(new D.TableRow({children:docxCells}));
  }
  return new D.Table({rows:docxRows,width:{size:100,type:D.WidthType.PERCENTAGE}});
}

function processCardContent(D, card, children){
  // 标题
  var titleEl=card.querySelector('.card-title');
  if(titleEl){
    children.push(new D.Paragraph({
      children:[new D.TextRun({text:titleEl.textContent,bold:true,size:28,color:"3B8CFF"})],
      spacing:{before:240,after:120},
      border:{bottom:{color:"3B8CFF",size:6,style:D.BorderStyle.SINGLE,space:4}},
    }));
  }
  // 文本
  var texts=card.querySelectorAll('.module-text, .ai-text p');
  for(var i=0;i<texts.length;i++){
    children.push(new D.Paragraph({
      children:[new D.TextRun({text:texts[i].textContent.trim(),size:22})],
      spacing:{before:60,after:80},
    }));
  }
  // 统计指标
  var metricRows=card.querySelectorAll('.metrics-row');
  for(var m=0;m<metricRows.length;m++){
    var items=metricRows[m].querySelectorAll('.metric-item');
    if(items.length>0){
      var cells=[];
      for(var n=0;n<items.length;n++){
        var val=items[n].querySelector('.metric-value').textContent.trim();
        var lab=items[n].querySelector('.metric-label').textContent.trim();
        cells.push(new D.TableCell({
          children:[
            new D.Paragraph({children:[new D.TextRun({text:val,bold:true,size:24,color:"3B8CFF"})],alignment:D.AlignmentType.CENTER}),
            new D.Paragraph({children:[new D.TextRun({text:lab,size:18,color:"4A6480"})],alignment:D.AlignmentType.CENTER}),
          ],
          margins:{top:80,bottom:80,left:60,right:60},
        }));
      }
      children.push(new D.Table({rows:[new D.TableRow({children:cells})],width:{size:100,type:D.WidthType.PERCENTAGE}}));
      children.push(new D.Paragraph({spacing:{before:80,after:80}}));
    }
  }
  // 图表
  var chartDivs=card.querySelectorAll('.chart-container');
  for(var c=0;c<chartDivs.length;c++){
    var canvas=chartDivs[c].querySelector('canvas');
    if(canvas){
      try{
        var imgData=canvas.toDataURL('image/png');
        var buf=dataURItoArrayBuffer(imgData);
        var ratio=canvas.height/canvas.width;
        children.push(new D.Paragraph({
          children:[new D.ImageRun({data:buf,transformation:{width:520,height:Math.round(520*ratio)}})],
          alignment:D.AlignmentType.CENTER,
          spacing:{before:80,after:80},
        }));
      }catch(e){}
    }
  }
  // 表格
  var tables=card.querySelectorAll('table.report-table');
  for(var t=0;t<tables.length;t++){
    var tbl=htmlTableToDocx(D, tables[t]);
    if(tbl){children.push(tbl);children.push(new D.Paragraph({spacing:{before:60,after:60}}));}
  }
  // 数据来源
  var notes=card.querySelectorAll('.data-source-note');
  for(var n2=0;n2<notes.length;n2++){
    children.push(new D.Paragraph({
      children:[new D.TextRun({text:notes[n2].textContent.trim(),size:16,color:"8BA5B8",italics:true})],
      spacing:{before:40,after:40},
    }));
  }
}

function buildDocx(){
  var D=window.docx;
  var children=[];
  var data=currentReportData || INDEX_DATA[currentCode];
  
  // 标题
  children.push(new D.Paragraph({
    children:[new D.TextRun({text:data.title,bold:true,size:36,color:"3B8CFF"})],
    alignment:D.AlignmentType.CENTER,
    spacing:{after:80},
  }));
  children.push(new D.Paragraph({
    children:[new D.TextRun({text:data.code_full + ' · ' + data.subtitle + ' · 数据截至：' + formatDate(data.data_date),size:20,color:"4A6480"})],
    alignment:D.AlignmentType.CENTER,
    spacing:{after:240},
  }));
  
  var cards=document.getElementById('reportContent').children;
  for(var i=0;i<cards.length;i++){
    processCardContent(D, cards[i], children);
  }
  
  // 风险提示
  var risk=document.querySelector('.risk-notice');
  if(risk){
    children.push(new D.Paragraph({
      children:[new D.TextRun({text:risk.textContent.trim(),size:18,color:"8A6D00"})],
      spacing:{before:160,after:80},
      shading:{fill:"FDF8EC"},
    }));
  }
  
  return new D.Document({
    sections:[{
      properties:{page:{margin:{top:1000,right:1000,bottom:1000,left:1000}}},
      children:children,
    }],
  });
}

function exportWord(){
  if(!currentCode || !currentReportData){
    showToast('请先生成长图');
    return;
  }
  var btn=document.getElementById('exportWordBtn');
  var originalText=btn.textContent;
  btn.innerHTML='<span class="export-loading"></span>正在生成文档...';
  btn.disabled=true;
  
  loadDocxLibrary().then(function(){
    var doc=buildDocx();
    var data=currentReportData;
    var filename=data.subtitle + '_指数投教长图_' + data.data_date + '.docx';
    return window.docx.Packer.toBlob(doc).then(function(blob){
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;a.download=filename;a.style.display='none';
      document.body.appendChild(a);a.click();
      setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},3000);
      showToast('Word文档已下载，可用WPS或Word打开编辑');
    });
  }).catch(function(e){
    showToast('导出失败: ' + e.message);
  }).then(function(){
    btn.textContent=originalText;
    btn.disabled=false;
  });
}

// 事件绑定
window.addEventListener('DOMContentLoaded', function(){
  // 设置日期选择器默认值和范围
  var dateInput = document.getElementById('reportDate');
  var todayStr = getTodayStr();
  dateInput.value = todayStr;
  dateInput.max = todayStr;
  // min 设为最早历史数据日期
  dateInput.min = '2021-07-01';

  loadData().then(function(){
    // 默认选中第一个
    var select=document.getElementById('indexSelect');
    if(select.options.length > 1) select.selectedIndex = 1;
  });
  
  document.getElementById('generateBtn').addEventListener('click', function(){
    var code=document.getElementById('indexSelect').value;
    if(!code){showToast('请先选择指数');return;}
    var selectedDate = dateInput.value || todayStr;

    // 后端交易规则：确定有效报告日期
    var firstKey = Object.keys(INDEX_DATA)[0];
    var refHistory = INDEX_DATA[firstKey].history;
    var effectiveDate = getEffectiveReportDate(selectedDate, refHistory);

    // 显示有效日期提示（后台规则，不暴露逻辑细节）
    var noteEl = document.getElementById('dateEffectiveNote');
    if(effectiveDate !== selectedDate){
      noteEl.textContent = '报告截止日期：' + effectiveDate;
      noteEl.classList.add('show');
    } else {
      noteEl.classList.remove('show');
    }

    showLoading();
    setTimeout(function(){
      var reportData = getReportData(code, selectedDate);
      renderReport(code, reportData);
      hideLoading();
    }, 300);
  });
  
  document.getElementById('exportWordBtn').addEventListener('click', exportWord);
  
  window.addEventListener('resize', function(){
    for(var k in chartInstances){
      if(chartInstances[k]) chartInstances[k].resize();
    }
  });
});
</script>
